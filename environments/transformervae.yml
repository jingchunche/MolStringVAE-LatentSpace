name: transformervae
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - numpy=1.24.4
  - pandas=1.5.3
  - tqdm=4.63.2
  - addict=2.4.0
  - pyyaml=6.0.2
  - scipy=1.10.1
  - scikit-learn=1.3.2
  # Used by evaluate.py, eval_recon.py, and eval_int.py.
  - rdkit=2024.03.2
  - pip:
      # Match the current CUDA 12.1 PyTorch installation used for training.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      # evaluate.py uses GPU FAISS when a GPU is available.
      - faiss-gpu==1.7.2
